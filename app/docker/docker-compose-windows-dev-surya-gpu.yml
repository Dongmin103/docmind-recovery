# Append this opt-in overlay after the Windows dev and generationless E2E
# overlays only on hosts with a working NVIDIA Container Toolkit runtime.
# The legacy service key preserves the app's surya-parser network alias and
# avoids running CPU and GPU model servers against the same licensed mount.
services:
  surya-parser-cpu:
    image: ${SURYA_GPU_IMAGE:-docmind-surya-parser:gpu-0.22.1-cuda12.4-sm61}
    build:
      context: ..
      dockerfile: parser_services/surya/Containerfile.gpu-amd64
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LLAMA_CPP_NGL: "99"
      LLAMA_CPP_EXTRA_ARGS: "--threads 8"
    labels:
      io.docmind.surya.acceleration: cuda12.4-sm61
