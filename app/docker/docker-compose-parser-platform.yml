services:
  ragflow-cpu:
    environment:
      PARSER_PLATFORM_ENABLED: ${PARSER_PLATFORM_ENABLED:-1}
      PARSER_PLATFORM_INTEGRATION_READY: ${PARSER_PLATFORM_INTEGRATION_READY:-1}
      PARSER_PLATFORM_PDF_ENABLED: ${PARSER_PLATFORM_PDF_ENABLED:-1}
      PARSER_PLATFORM_OFFICE_ENABLED: ${PARSER_PLATFORM_OFFICE_ENABLED:-1}
      PARSER_PLATFORM_HWP_ENABLED: ${PARSER_PLATFORM_HWP_ENABLED:-1}
      PARSER_PLATFORM_POLICY_VERSION: ${PARSER_PLATFORM_POLICY_VERSION:-parser-platform-policy-v1}
      PARSER_PLATFORM_KORDOC_PDF_ENABLED: ${PARSER_PLATFORM_KORDOC_PDF_ENABLED:-1}
      PARSER_PLATFORM_KORDOC_DOCX_ENABLED: ${PARSER_PLATFORM_KORDOC_DOCX_ENABLED:-1}
      PARSER_PLATFORM_KORDOC_EXCEL_ENABLED: ${PARSER_PLATFORM_KORDOC_EXCEL_ENABLED:-1}
      PARSER_PLATFORM_KORDOC_PPTX_ENABLED: ${PARSER_PLATFORM_KORDOC_PPTX_ENABLED:-1}
      PARSER_PLATFORM_KORDOC_HWP_ENABLED: ${PARSER_PLATFORM_KORDOC_HWP_ENABLED:-1}
      PARSER_PLATFORM_KORDOC_URL: http://kordoc-parser:8095
      PARSER_PLATFORM_KORDOC_DEADLINE_SECONDS: ${PARSER_PLATFORM_KORDOC_DEADLINE_SECONDS:-900}
      PARSER_PLATFORM_KORDOC_MAX_SOURCE_BYTES: ${PARSER_PLATFORM_KORDOC_MAX_SOURCE_BYTES:-67108864}
      PARSER_PLATFORM_KORDOC_PARSER_VERSION: "4.15.7"
      PARSER_PLATFORM_KORDOC_PATCH_REVISION: sha256:25378aebb75d6507296cc22b60a6158935ca3af5a4ac888708b3cee08f21646b
      PARSER_PLATFORM_KORDOC_OCR_MODEL_REVISION: ${PARSER_PLATFORM_KORDOC_OCR_MODEL_REVISION:-kordoc-4.15.7-default}
      PARSER_PLATFORM_KORDOC_NORMALIZER_REVISION: docmind-kordoc-normalizer-v3
      PARSER_PLATFORM_KORDOC_CHUNKER_REVISION: docmind-kordoc-chunker-v2
      PARSER_PLATFORM_LIBREOFFICE_CONVERTER_REVISION: ${PARSER_PLATFORM_LIBREOFFICE_CONVERTER_REVISION:-libreoffice-4:7.4.7-1+deb12u14}
      PARSER_PLATFORM_ARTIFACT_ROOT: /ragflow/parser-platform-artifacts
      PARSER_PLATFORM_MAX_SOURCE_BYTES: ${PARSER_PLATFORM_MAX_SOURCE_BYTES:-536870912}
      PARSER_PLATFORM_MAX_PDF_PAGES: ${PARSER_PLATFORM_MAX_PDF_PAGES:-2000}
      PARSER_PLATFORM_PDF_DEADLINE_SECONDS: ${PARSER_PLATFORM_PDF_DEADLINE_SECONDS:-7200}
      PARSER_PLATFORM_PDF_HEARTBEAT_TIMEOUT_SECONDS: ${PARSER_PLATFORM_PDF_HEARTBEAT_TIMEOUT_SECONDS:-1800}
      TE_RUN_MODE: ${TE_RUN_MODE:-0}
    volumes:
      - parser_platform_artifacts:/ragflow/parser-platform-artifacts
    networks:
      - ragflow
      - parser_internal

  kordoc-parser:
    platform: linux/amd64
    init: true
    image: ${KORDOC_IMAGE:-docmind-kordoc-parser:4.15.7-cutover-amd64}
    build:
      context: ../parser_services/kordoc
      dockerfile: Containerfile
    environment:
      KORDOC_OFFLINE: "1"
      KORDOC_MODEL_CACHE: /models/kordoc
      KORDOC_REQUIRE_OCR: "1"
      KORDOC_MAX_SOURCE_BYTES: ${PARSER_PLATFORM_KORDOC_MAX_SOURCE_BYTES:-67108864}
      KORDOC_MAX_PDF_PAGES: ${PARSER_PLATFORM_MAX_PDF_PAGES:-2000}
      KORDOC_CONVERSION_TIMEOUT_MS: "180000"
    networks:
      parser_internal:
        aliases: [kordoc-parser]
    read_only: true
    volumes:
      - ${KORDOC_OCR_MODEL_DIR:-../models/kordoc}:/models/kordoc:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${KORDOC_MEMORY_LIMIT:-3g}
    cpus: ${KORDOC_CPUS:-2}
    pids_limit: 64
    restart: unless-stopped

networks:
  parser_internal:
    internal: true

volumes:
  parser_platform_artifacts:
