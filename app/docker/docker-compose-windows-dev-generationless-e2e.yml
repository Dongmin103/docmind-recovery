services:
  # This overlay is opt-in and exists only for the cloud-source ingestion and
  # C-search validation path.  It keeps Jina fail-closed, but deliberately does
  # not require or inject an answer-generation credential because DocMind
  # /docmind/search ends at reranked chunks.
  model-secret-gate:
    environment:
      JINA_API_KEY: ${JINA_API_KEY:-}
      JINA_API_KEY_FILE: ${DOCMIND_E2E_JINA_API_KEY_FILE:-}
      DOCMIND_E2E_BOOTSTRAP_ONLY: ${DOCMIND_E2E_BOOTSTRAP_ONLY:-0}
      DOCMIND_GENERATOR_MODEL: ""
      DASHSCOPE_API_KEY: ""
    command:
      - /bin/sh
      - -ec
      - |
        fail() { echo "Windows generationless E2E model gate failed: $$1" >&2; exit 1; }
        case "$$DOCMIND_E2E_BOOTSTRAP_ONLY" in 0|1) ;; *) fail "DOCMIND_E2E_BOOTSTRAP_ONLY must be 0 or 1" ;; esac
        if [ "$$DOCMIND_E2E_BOOTSTRAP_ONLY" = 0 ]; then
          if [ -n "$$JINA_API_KEY_FILE" ]; then
            [ -r "$$JINA_API_KEY_FILE" ] || fail "JINA_API_KEY_FILE is missing or unreadable"
            jina_api_key="$$(cat "$$JINA_API_KEY_FILE")"
          else
            jina_api_key="$$JINA_API_KEY"
          fi
          [ "$${#jina_api_key}" -ge 12 ] || fail "Jina API credential is missing"
          case "$$jina_api_key" in *CHANGE_ME*|*PLACEHOLDER*|*GENERATED_LOCALLY*) fail "Jina API credential contains a placeholder" ;; esac
        fi
        [ -z "$$DOCMIND_GENERATOR_MODEL" ] || fail "answer generation must remain disabled"
        [ -z "$$DASHSCOPE_API_KEY" ] || fail "answer credential must remain disabled"
        echo "Generationless E2E boundary validated (bootstrap_only=$$DOCMIND_E2E_BOOTSTRAP_ONLY; no secrets logged)."

  ragflow-cpu:
    depends_on:
      kordoc-parser:
        condition: service_healthy
    environment:
      # The isolated E2E path retains its process-environment fallback when
      # DOCMIND_E2E_JINA_API_KEY_FILE is unset. Operational Windows wiring sets
      # it to the read-only /run/secrets mount instead.
      JINA_API_KEY_FILE: ${DOCMIND_E2E_JINA_API_KEY_FILE:-}
      DOCMIND_E2E_BOOTSTRAP_ONLY: ${DOCMIND_E2E_BOOTSTRAP_ONLY:-0}
      DOCMIND_GENERATIONLESS_E2E_ENABLED: "1"
      API_PROXY_SCHEME: python
      COMPOSE_PROFILES: full,tei-cpu
      TEI_MODEL: BAAI/bge-m3
      DOCMIND_GENERATOR_MODEL: ""
      DASHSCOPE_API_KEY: ""
      DOCMIND_SHARED_WORKSPACE_ENABLED: "1"
      DOCMIND_SHARED_USER_EMAIL: docmind-e2e@internal.invalid
      DOCMIND_CATALOG_DB_PRIMARY_ENABLED: "1"
      PARSER_PLATFORM_ENABLED: "1"
      PARSER_PLATFORM_INTEGRATION_READY: "1"
      PARSER_PLATFORM_OFFICE_ENABLED: "1"
      PARSER_PLATFORM_HWP_ENABLED: "1"
      PARSER_PLATFORM_KORDOC_PDF_ENABLED: "1"
      PARSER_PLATFORM_KORDOC_DOCX_ENABLED: "1"
      PARSER_PLATFORM_KORDOC_EXCEL_ENABLED: "1"
      PARSER_PLATFORM_KORDOC_PPTX_ENABLED: "1"
      PARSER_PLATFORM_KORDOC_HWP_ENABLED: "1"
      PARSER_PLATFORM_KORDOC_URL: http://kordoc-parser:8095
      PARSER_PLATFORM_KORDOC_PATCH_REVISION: sha256:25378aebb75d6507296cc22b60a6158935ca3af5a4ac888708b3cee08f21646b
      PARSER_PLATFORM_LIBREOFFICE_CONVERTER_REVISION: libreoffice-4:7.4.7-1+deb12u14
    volumes:
      - ../scripts/docmind_generationless_e2e_seed.py:/ragflow/scripts/docmind_generationless_e2e_seed.py:ro
    networks:
      docmind-parser-internal: {}

  kordoc-parser:
    profiles: [full]
    platform: linux/amd64
    image: ${KORDOC_IMAGE:-docmind-kordoc-parser:4.15.7-cutover-amd64}
    build:
      context: ../parser_services/kordoc
      dockerfile: Containerfile
    environment:
      KORDOC_OFFLINE: "1"
      KORDOC_MODEL_CACHE: /models/kordoc
      KORDOC_REQUIRE_OCR: "1"
      KORDOC_MAX_SOURCE_BYTES: ${PARSER_PLATFORM_KORDOC_MAX_SOURCE_BYTES:-67108864}
      KORDOC_MAX_PDF_PAGES: ${PARSER_PLATFORM_MAX_PDF_PAGES:-2000}
      KORDOC_CONVERSION_TIMEOUT_MS: "180000"
    networks:
      docmind-parser-internal:
        aliases: [kordoc-parser]
    volumes:
      - ${KORDOC_OCR_MODEL_DIR:-../models/kordoc}:/models/kordoc:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${KORDOC_MEMORY_LIMIT:-3g}
    cpus: ${KORDOC_CPUS:-2}
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8095/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 20

networks:
  docmind-parser-internal:
    internal: true
