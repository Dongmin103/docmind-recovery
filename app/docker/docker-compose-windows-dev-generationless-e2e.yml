services:
  # This overlay is opt-in and exists only for the cloud-source ingestion and
  # C-search validation path.  It keeps Jina fail-closed, but deliberately does
  # not require or inject an answer-generation credential because DocMind
  # /docmind/search ends at reranked chunks.
  model-secret-gate:
    environment:
      JINA_API_KEY: ${JINA_API_KEY:-}
      DOCMIND_E2E_BOOTSTRAP_ONLY: ${DOCMIND_E2E_BOOTSTRAP_ONLY:-0}
      DOCMIND_GENERATOR_MODEL: ""
      DASHSCOPE_API_KEY: ""
    command:
      - /bin/sh
      - -ec
      - |
        fail() { echo "Windows generationless E2E model gate failed: $$1" >&2; exit 1; }
        case "$$DOCMIND_E2E_BOOTSTRAP_ONLY" in 0|1) ;; *) fail "DOCMIND_E2E_BOOTSTRAP_ONLY must be 0 or 1" ;; esac
        if [ "$$DOCMIND_E2E_BOOTSTRAP_ONLY" = 0 ]; then
          [ "$${#JINA_API_KEY}" -ge 12 ] || fail "JINA_API_KEY is missing"
          case "$$JINA_API_KEY" in *CHANGE_ME*|*PLACEHOLDER*|*GENERATED_LOCALLY*) fail "JINA_API_KEY contains a placeholder" ;; esac
        fi
        [ -z "$$DOCMIND_GENERATOR_MODEL" ] || fail "answer generation must remain disabled"
        [ -z "$$DASHSCOPE_API_KEY" ] || fail "answer credential must remain disabled"
        echo "Generationless E2E boundary validated (bootstrap_only=$$DOCMIND_E2E_BOOTSTRAP_ONLY; no secrets logged)."

  ragflow-cpu:
    depends_on:
      docling-office-parser:
        condition: service_healthy
    environment:
      DOCMIND_E2E_BOOTSTRAP_ONLY: ${DOCMIND_E2E_BOOTSTRAP_ONLY:-0}
      API_PROXY_SCHEME: python
      COMPOSE_PROFILES: full,tei-cpu
      TEI_MODEL: BAAI/bge-m3
      DOCMIND_GENERATOR_MODEL: ""
      DASHSCOPE_API_KEY: ""
      DOCMIND_SHARED_WORKSPACE_ENABLED: "1"
      DOCMIND_SHARED_USER_EMAIL: docmind-e2e@internal.invalid
      DOCMIND_CATALOG_DB_PRIMARY_ENABLED: "1"
      PARSER_PLATFORM_ENABLED: "1"
      PARSER_PLATFORM_INTEGRATION_READY: "1"
      PARSER_PLATFORM_OFFICE_ENABLED: "1"
      PARSER_PLATFORM_DOCLING_OFFICE_URL: http://docling-office-parser:8092
    volumes:
      - ../scripts/docmind_generationless_e2e_seed.py:/ragflow/scripts/docmind_generationless_e2e_seed.py:ro

  docling-office-parser:
    profiles: [full]
    platform: linux/amd64
    image: ${DOCLING_OFFICE_IMAGE:-docmind-docling-office:2.115.0-amd64}
    build:
      context: ..
      dockerfile: parser_services/docling_office/Containerfile
      args:
        UV_BASE_IMAGE: ${DOCLING_UV_BASE_IMAGE:-ghcr.io/astral-sh/uv:0.11.7@sha256:733b4042187702f832f7fdecb3aff14a61b288c4ca37af188bb5715c1caebaf8}
        PYTHON_BASE_IMAGE: ${DOCLING_PYTHON_BASE_IMAGE:-python:3.12.13-slim-trixie@sha256:d657ab0ade19f404a6ccc883ab399540de667aff751748ce23c07330c5a89e64}
    environment:
      DOCLING_OFFICE_MAX_SOURCE_BYTES: ${PARSER_PLATFORM_MAX_SOURCE_BYTES:-536870912}
    networks:
      docmind-dev:
        aliases: [docling-office-parser]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${DOCLING_OFFICE_MEMORY_LIMIT:-2g}
    cpus: ${DOCLING_OFFICE_CPUS:-2}
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 12
