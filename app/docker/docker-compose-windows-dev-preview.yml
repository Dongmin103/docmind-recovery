# Append to the existing Windows development compose stack. This overlay does
# not replace the ingestion/OCR overlays or change their source mounts.
services:
  ragflow-cpu:
    environment:
      DOCMIND_PREVIEW_ENABLED: "1"
      DOCMIND_PREVIEW_ROOT: /run/docmind-previews
      DOCMIND_PREVIEW_PROCESSOR_URL: http://docmind-preview-processor:8090
    volumes:
      - preview_memory:/run/docmind-previews
    networks:
      docmind-preview-internal: {}

  docmind-preview-processor:
    profiles: [full]
    platform: linux/amd64
    image: ${DOCMIND_PREVIEW_IMAGE:-docmind-preview-processor:development}
    build:
      context: ../parser_services
      dockerfile: preview/Containerfile
    environment:
      DOCMIND_PREVIEW_ROOT: /run/docmind-previews
      HOME: /run/docmind-previews/processor-home
      TMPDIR: /run/docmind-previews/processor-tmp
      XDG_CACHE_HOME: /run/docmind-previews/processor-cache
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - preview_memory:/run/docmind-previews
    networks:
      docmind-preview-internal: {}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 12

networks:
  docmind-preview-internal:
    internal: true

# One shared, RAM-backed filesystem caps retained originals, rendered pages,
# converter scratch and outputs TOGETHER. No persistent plaintext data volume.
volumes:
  preview_memory:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=268435456,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
