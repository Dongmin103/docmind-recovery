name: DocMind source gates

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --config .gitleaks.toml --no-banner --redact --exit-code 1

  source-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Python syntax
        run: >-
          python -m compileall -q
          api/apps/restful_apis/docmind_api.py
          api/apps/services/docmind_*.py
          api/db/services/*docmind*.py
          parser_services
          rag/parser_platform
          scripts/docmind_*.py
      - name: Compose contract
        run: |
          cp docker/.env.docmind.cpu.example docker/.env.docmind.cpu
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose-docmind.yml \
            -f docker/docker-compose-parser-platform.yml \
            --env-file docker/.env \
            --env-file docker/.env.docmind.cpu \
            config --quiet
      - name: Public path contract
        run: |
          test ! -e .omx
          test ! -e output
          test ! -e api/apps/services/docmind_catalog.json
          ! find . -path ./.git -prune -o -type f \( \
            -name '*.gguf' -o -name '*.safetensors' -o -name '*.hwp' -o \
            -name '*.hwpx' -o -name '*.key' -o -name '*.p12' -o \
            -name '*.pfx' -o -name '*.sqlite' -o -name '*.sqlite3' \
          \) -print -quit | grep -q .

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: >-
          npm test -- --runInBand --coverage=false
          src/pages/docmind
          src/services/docmind-service.test.ts
          src/utils/docmind-inspection-link.test.ts
          src/utils/docmind-shared-workspace.test.ts
          src/utils/docmind-workspace.test.ts
      - run: NODE_OPTIONS=--max-old-space-size=8192 npm run build
