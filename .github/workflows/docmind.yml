name: DOCMIND package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Package boundary and corruption tests
        run: python -m unittest discover -s tools/tests -p test_package_docmind.py -v
      - name: Retired runtime gate
        run: python app/scripts/verify_removed_runtime.py
      - name: Build and verify committed deployment package
        run: |
          python tools/package_docmind.py --output .local/packages/docmind.zip
          python tools/package_docmind.py --verify .local/packages/docmind.zip
      - name: Downloadable DOCMIND package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docmind-${{ github.sha }}
          path: .local/packages/docmind.zip
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - name: DOCMIND frontend tests
        run: npm test -- --runInBand --coverage=false src/pages/docmind src/services/docmind-service.test.ts src/services/docmind-answer-job.test.ts
      - name: DOCMIND frontend build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_BUILD_SOURCEMAP: "false"
          VITE_MINIFY: esbuild
